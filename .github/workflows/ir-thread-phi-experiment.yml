name: Tier 1 wide phi experiment
on:
  push:
    branches: [codex/ir-thread-phi-cloud-20261119]
    paths: ['docs/measurements/ir-thread-phi-2026-11-19/**']
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - name: Check the hosted CPU
        run: |
          lscpu | grep -m1 'Model name'
          grep -qw avx512f /proc/cpuinfo
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          sparse-checkout: docs/measurements/ir-thread-phi-2026-11-19
          path: record
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: buster14a/buster
          ref: 6427879e1143026a12fb0388a20bdea1fe4b2bc5
          persist-credentials: false
          path: buster
      - name: Verify the repository's full AVX-512 host predicate
        working-directory: buster
        run: |
          gcc -std=c17 -O2 -march=x86-64-v4 -maes -mgfni -mvaes -mavx512vbmi -mavx512vbmi2 -mavx512vpopcntdq -mavx512bitalg -mavx512vnni tools/ci/vector-probe.c -o "$RUNNER_TEMP/probe"
          "$RUNNER_TEMP/probe"
      - name: Run the pinned experiment
        working-directory: buster
        run: bash "$GITHUB_WORKSPACE/record/docs/measurements/ir-thread-phi-2026-11-19/run.sh"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: wide-phi-record
          path: buster/record/
          if-no-files-found: ignore
