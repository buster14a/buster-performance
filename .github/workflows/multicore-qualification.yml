name: Multicore acceptance harness qualification

on:
  pull_request:
    paths:
      - 'docs/measurements/multicore-149/**'
      - '.github/workflows/multicore-qualification.yml'
  push:
    branches: [main]
    paths:
      - 'docs/measurements/multicore-149/**'
      - '.github/workflows/multicore-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: multicore-149-${{ github.event.pull_request.number || (github.event_name == 'push' && format('push-{0}', github.run_id)) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  qualify:
    # Stand-in subprocesses, original temporary fixtures and preparation of frozen inputs
    # only; no compiler campaign or timing claim. Native measurements use the approved
    # 9700X and its per-sample lock outside this hosted qualification workflow.
    name: Harness self-tests (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: ${{ github.event_name == 'pull_request' }}
      matrix:
        mode: [plain, sanitize]
    defaults:
      run:
        shell: bash
    env:
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - name: Check out the triggering revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Record the source and hosted toolchain
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/multicore-149"
          mkdir -p "$out"
          git rev-parse HEAD > "$out/commit.txt"
          shopt -s nullglob
          sources=(docs/measurements/multicore-149/*.c docs/measurements/multicore-149/*.h)
          test "${#sources[@]}" -gt 0
          sha256sum "${sources[@]}" > "$out/sources.sha256"
          uname -srvm > "$out/host.txt"
          clang --version 2>&1 | tee "$out/clang.txt"

      - name: Build both standalone C tools
        timeout-minutes: 3
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          source="$PWD/docs/measurements/multicore-149"
          out="$RUNNER_TEMP/multicore-149"
          flags=(-std=c17 -Wall -Wextra -Werror -fno-strict-aliasing)
          if [ "$MODE" = sanitize ]; then
            flags+=(-O1 -g -fno-omit-frame-pointer -fno-optimize-sibling-calls -fsanitize=address,undefined -fno-sanitize-recover=all)
          else
            flags+=(-O2)
          fi
          printf '%s\n' "${flags[@]}" > "$out/flags.txt"
          for name in runner prepare; do
            clang "${flags[@]}" "$source/$name.c" -o "$out/$name" 2>&1 | tee "$out/build-$name.log"
          done

      - name: Check fixture preparation and subprocess accounting
        timeout-minutes: 5
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/multicore-149"
          mkdir "$out/tmp"
          export TMPDIR="$out/tmp"
          for name in prepare runner; do
            timeout --signal=TERM --kill-after=5s 120s "$out/$name" --self-test 2>&1 | tee "$out/test-$name.log"
          done
          git diff --exit-code

      - name: Check out the pinned frozen-input verifier
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: buster14a/buster
          ref: d9442df0dde83b9701b6ff7487f8916641736a84
          path: build/multicore-corpus-verifier
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/ci/fetch-corpus.sh
            tools/ci/cached-download.sh
            LICENSE
            LICENSING.md

      - name: Verify the frozen source and header inputs
        timeout-minutes: 3
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/multicore-149"
          verifier="$PWD/build/multicore-corpus-verifier"
          git -C "$verifier" rev-parse HEAD > "$out/corpus-verifier-commit.txt"
          sha256sum "$verifier/tools/ci/fetch-corpus.sh" "$verifier/tools/ci/cached-download.sh" > "$out/corpus-verifier-sources.sha256"
          bash "$verifier/tools/ci/fetch-corpus.sh" "$RUNNER_TEMP/multicore-corpus" 2>&1 | tee "$out/fetch-corpus.log"
          sha256sum "$RUNNER_TEMP/multicore-corpus/MANIFESTS.sha256" > "$out/corpus-manifest.sha256"

      - name: Qualify preparation against the real frozen corpus
        timeout-minutes: 3
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/multicore-149"
          export TMPDIR="$out/tmp"
          timeout --signal=TERM --kill-after=5s 120s "$out/prepare" --self-test --corpus "$RUNNER_TEMP/multicore-corpus" 2>&1 | tee "$out/test-frozen-corpus.log"
          git diff --exit-code

      - name: Preserve qualification logs and retained failure fixtures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: multicore-149-${{ matrix.mode }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/multicore-149
          if-no-files-found: error
          retention-days: 14

  real-driver:
    # Exercise the actual merged Buster driver, pinned lane receipts and standalone preparer.
    # This hosted smoke test is not native multicore qualification or a timing run.
    name: Prepared arguments with the merged Buster driver
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out campaign tools
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Check out merged lane-pinning compiler
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: buster14a/buster
          ref: 2dc50258e8b33393474b64032a5cbe9f17c63def
          path: build/multicore-compiler
          persist-credentials: false

      - name: Install pinned compiler build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends zstd
          bash build/multicore-compiler/tools/ci/setup-benchpress.sh

      - name: Build the compiler and prepare the pinned cases
        run: |
          set -euo pipefail
          project="$PWD"
          compiler_tree="$project/build/multicore-compiler"
          out="$RUNNER_TEMP/multicore-driver-smoke"
          mkdir -p "$out"
          test "$(git -C "$compiler_tree" rev-parse HEAD)" = 2dc50258e8b33393474b64032a5cbe9f17c63def
          (cd "$compiler_tree" && BUSTER_HOST_ARCH=x86-64 BUSTER_DEBUG_INFO=0 ./build.sh --config Release)
          compiler="$compiler_tree/build/compiler"
          clang -std=c17 -O2 -Wall -Wextra -Werror -fno-strict-aliasing \
            docs/measurements/multicore-149/prepare.c -o "$out/prepare"
          bash "$compiler_tree/tools/ci/fetch-corpus.sh" "$out/corpus"
          "$compiler" test-check-units --generate "$out/synth" --units 512 --functions 200 --seed 149
          "$out/prepare" --corpus "$out/corpus" --synth "$out/synth" --output "$out/cases"

      - name: Compile one source from each case with its prepared options
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/multicore-driver-smoke"
          compiler="$PWD/build/multicore-compiler/build/compiler"
          unset MAKEFLAGS MFLAGS CPATH C_INCLUDE_PATH CPLUS_INCLUDE_PATH OBJC_INCLUDE_PATH LIBRARY_PATH COMPILER_PATH GCC_EXEC_PREFIX BUSTER_CLANG_RESOURCE_DIR
          export LC_ALL=C LANG=C TZ=UTC SOURCE_DATE_EPOCH=0
          cpu="$(python3 -c 'import os; print(min(os.sched_getaffinity(0)))')"
          expected_pin="$(printf 'lane-pin\tindex=0\texpected=%s\tobserved=%s\tstatus=0' "$cpu" "$cpu")"
          for name in sqlite synth musl; do
            mapfile -t all_args < "$out/cases/$name/args.txt"
            args=()
            sources=0
            selected=''
            for arg in "${all_args[@]}"; do
              if [[ "$arg" = /*.c ]]; then
                sources=$((sources + 1))
                if [[ -n "$selected" ]]; then continue; fi
                selected="$arg"
              fi
              args+=("$arg")
            done
            test "$sources" -eq "$(wc -l < "$out/cases/$name/outputs.txt")"
            test -n "$selected"
            mkdir "$out/smoke-$name"
            (cd "$out/smoke-$name" && "$compiler" --lanes 1 --lane-cpus "$cpu" --worker-budget=1 --time-stages "${args[@]}" 2> "$out/$name-stages.log")
            test "$(grep -c '^lane-pin' "$out/$name-stages.log")" -eq 1
            grep -Fx -- "$expected_pin" "$out/$name-stages.log"
            object="$(basename "${selected%.c}").o"
            test -s "$out/smoke-$name/$object"
          done

      - name: Check out the diagnostic prototype's pinned base
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: buster14a/buster
          ref: 2dc50258e8b33393474b64032a5cbe9f17c63def
          path: build/wait-diagnostic-base
          persist-credentials: false

      - name: Check that the diagnostic applicator fails closed
        run: |
          python3 docs/measurements/multicore-149/wait-diagnostic-merged-2026-11-06/test-applicator.py \
            "$PWD/build/wait-diagnostic-base"
