name: 'Foreign GC 3037 hosted reproduction'
on:
  push:
    branches: ['measurement/foreign-gc-3037-hosted']
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-26.04
    timeout-minutes: 65
    env:
      BUSTER_HOST_ARCH: vector
      BUSTER_DEBUG_INFO: '0'
      BUSTER_SANITIZER: none
      BUSTER_SANITIZER_OPTIMIZATION: '3'
      LC_ALL: C
    steps:
      - name: Check out the baseline
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: buster14a/buster
          ref: 6427879e1143026a12fb0388a20bdea1fe4b2bc5
          persist-credentials: false
      - name: Verify hosted ISA
        run: |
          lscpu | head -28
          cc -std=c17 -O2 -march=x86-64-v4 -maes -mgfni -mvaes -mavx512vbmi -mavx512vbmi2 -mavx512vpopcntdq -mavx512bitalg -mavx512vnni tools/ci/vector-probe.c -o "$RUNNER_TEMP/probe"
          "$RUNNER_TEMP/probe"
      - name: Fetch the dated measurement scripts
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: buster14a/buster-performance
          ref: ${{ github.sha }}
          path: evidence
          persist-credentials: false
          sparse-checkout: docs/measurements/foreign-gc-borrow-3037
      - name: Check out zlib 1.3.1
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: madler/zlib
          ref: 51b7f2abdade71cd9bb0e7a373ef2610ec6f9daf
          path: zlib
          persist-credentials: false
      - name: Stage the source revision's toolchain
        run: |
          dirs=$(bash tools/ci/session-toolchain.sh stage)
          tr : '\n' <<< "$dirs" >> "$GITHUB_PATH"
      - name: Run the experiment
        shell: bash
        run: |
          set -euo pipefail
          clang --version
          if [[ -f evidence/docs/measurements/foreign-gc-borrow-3037/compare.sh ]]; then
            bash evidence/docs/measurements/foreign-gc-borrow-3037/compare.sh
          else
            ./build.sh --config Release
            mkdir -p "$RUNNER_TEMP/base"
            cd "$RUNNER_TEMP/base"
            flags=(-O2 -fno-pie -ffunction-sections -fdata-sections -fno-asynchronous-unwind-tables -fno-unwind-tables)
            for unit in adler32 crc32; do clang "${flags[@]}" -c "$GITHUB_WORKSPACE/zlib/$unit.c" -o "$unit.o"; done
            cat > driver.c <<'EOF'
          extern unsigned long adler32(unsigned long, const unsigned char *, unsigned);
          extern unsigned long crc32(unsigned long, const unsigned char *, unsigned);
          int checksums(void) {
              const unsigned char *s = (const unsigned char *)"123456789";
              return adler32(1, s, 9) == 0x091e01deUL && crc32(0, s, 9) == 0xcbf43926UL ? 42 : 1;
          }
          EOF
            clang "${flags[@]}" -c driver.c
            printf '%s\n' '.text' '.globl _start' '_start:' 'call checksums' 'mov %eax,%edi' 'mov $60,%eax' 'syscall' '.section .note.GNU-stack,"",@progbits' > start.s
            clang -c start.s
            for o in *.o; do if readelf -SW "$o" | grep -F '.eh_frame'; then exit 1; fi; done
            "$GITHUB_WORKSPACE/build/compiler" link-foreign -static -e _start --gc-sections -o checksums start.o driver.o adler32.o crc32.o
            rc=0; ./checksums || rc=$?; echo "normal link exit=$rc"; test "$rc" = 42
            sha256sum checksums
            cd "$GITHUB_WORKSPACE"
            ./build/compiler test-foreign --cross-check
          fi
