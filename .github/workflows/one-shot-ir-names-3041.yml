name: Text IR import work counts (3041)
on:
  push:
    branches: [codex/3041-hosted-proof]
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    env:
      BUSTER_HOST_ARCH: vector
      BUSTER_DEBUG_INFO: '0'
      BUSTER_SANITIZER: none
      BUSTER_SANITIZER_OPTIMIZATION: '3'
      BUSTER_LINKER: auto
    steps:
      - name: Check out the compiler baseline
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: buster14a/buster
          ref: 6427879e1143026a12fb0388a20bdea1fe4b2bc5
          persist-credentials: false
      - name: Qualify this GitHub-hosted VM
        run: |
          set -eu
          lscpu | grep -E 'Model name|Hypervisor'
          mapfile -d '' flags < <(BUSTER_TOOLCHAIN=path ./build.sh print-host-flags)
          cc "${flags[@]}" tools/ci/vector-probe.c -o "$RUNNER_TEMP/probe"
          "$RUNNER_TEMP/probe"
      - name: Load the one-shot measurement driver
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          path: .measurement
          sparse-checkout: |
            docs/measurements/text-ir-names-3041
          persist-credentials: false
      - name: Build and run the comparison
        shell: bash
        run: bash .measurement/docs/measurements/text-ir-names-3041/run.sh
