name: Perf metric semantic qualification
on:
  pull_request:
    paths:
      - 'docs/measurements/microarchitecture-2026-10-29/scripts/**'
      - '.github/workflows/metric-qualification.yml'
  push:
    branches: [main]
    paths:
      - 'docs/measurements/microarchitecture-2026-10-29/scripts/**'
      - '.github/workflows/metric-qualification.yml'
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Regression tests and complete frozen-capture audit
        shell: bash
        run: |
          set -euo pipefail
          root=docs/measurements/microarchitecture-2026-10-29
          export PYTHONPATH="$PWD/$root/scripts"
          python3 -m unittest discover -s "$root/scripts/tests" -v
          python3 "$root/scripts/qualify-metrics.py" "$root/zen5/current" --out "$RUNNER_TEMP/metric-qualification-875"
          python3 - <<'PY'
          import json, os
          from decimal import Decimal
          from pathlib import Path
          from metric_qualification import Inventory, archived_capture, qualify
          root = Path('docs/measurements/microarchitecture-2026-10-29/zen5/current')
          raw = (root / 'measurements.jsonl').read_bytes()
          inv = (root / 'perf-list.json').read_bytes()
          assert archived_capture(raw, inv), 'historical inputs changed; review the archive identity'
          inventory = Inventory(json.loads(inv))
          rows = {(r['workload'], r['variant']): r for r in map(json.loads, raw.splitlines()) if r.get('kind') == 'metric'}
          for workload in ('preprocess', 'syntax', 'compile'):
              for name in ('lpm_cycles_user', 'lpm_cycles_kernel', 'lpm_cycles_guest', 'lpm_cycles_total', 'lpm_ldst_total_ld'):
                  result = qualify(rows[workload, name], inventory, historical=True)
                  assert not result['eligible'] and result['value'] is None, result
                  assert result['qualification'] == 'semantically-invalid', result
          result = qualify(rows['compile', 'branch_misprediction_rate'], inventory, historical=True)
          assert result['eligible'] and result['qualification'] == 'rounded-to-zero', result
          assert abs(Decimal(result['value']) - Decimal(3590833) / Decimal(211482428)) < Decimal('1e-25'), result
          print('Complete archive identities and issue #875 examples: PASS')
          PY
          mkdir "$RUNNER_TEMP/metric-qualification-875/inputs"
          cp "$root/zen5/current/measurements.jsonl" "$root/zen5/current/perf-list.json" "$root/zen5/current/environment.json" "$RUNNER_TEMP/metric-qualification-875/inputs/"
          git rev-parse HEAD > "$RUNNER_TEMP/metric-qualification-875/reader-commit.txt"
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: metric-qualification-875
          path: ${{ runner.temp }}/metric-qualification-875
          if-no-files-found: error
