name: Foreign strings hosted experiment 3042
on:
  push:
    branches: [qualification/3042-foreign-strings]
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: buster14a/buster
          ref: 6427879e1143026a12fb0388a20bdea1fe4b2bc5
          path: buster
          persist-credentials: false
      - name: Check the ordinary hosted CPU
        working-directory: buster
        run: |
          cc -std=c17 -O2 -Wall -Wextra -Werror -march=x86-64-v4 -maes -mgfni -mvaes -mavx512vbmi -mavx512vbmi2 -mavx512vpopcntdq -mavx512bitalg -mavx512vnni tools/ci/vector-probe.c -o /tmp/buster-vector-probe
          lscpu | sed -n '/Model name/p'
          /tmp/buster-vector-probe
      - name: Check out the measurement harness
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          path: record
          sparse-checkout: docs/measurements/foreign-strings-no-benefit-3042/harness
          persist-credentials: false
      - name: Trace the base driver
        working-directory: buster
        env:
          BUSTER_HOST_ARCH: vector
          BUSTER_SANITIZER: none
          BUSTER_DEBUG_INFO: '0'
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdb zstd libzstd-dev libxml2-dev zlib1g-dev
          export PATH="$(bash tools/ci/session-toolchain.sh stage):$PATH"
          clang --version
          harness="$GITHUB_WORKSPACE/record/docs/measurements/foreign-strings-no-benefit-3042/harness"
          bash "$harness/inputs.sh" "$RUNNER_TEMP/inputs"
          bash "$harness/instrument.sh"
          ./build.sh --config Release
          bash "$harness/cases.sh" ./build/compiler "$RUNNER_TEMP/inputs" "$RUNNER_TEMP/baseline"
