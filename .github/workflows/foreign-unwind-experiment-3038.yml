name: Preserve foreign unwind comparison 3038
on:
  push:
    branches: [codex/3038-unwind-hosted]
permissions:
  contents: read
  actions: read
jobs:
  capture:
    runs-on: ubuntu-26.04
    timeout-minutes: 3
    steps:
      - name: Verify and export the paired measurement archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          api=repos/buster14a/buster-performance/actions/artifacts/14570013495
          file="$RUNNER_TEMP/paired-captures.zip"
          gh api "$api/zip" > "$file"
          test "$(wc -c < "$file")" -eq 120354
          unzip -tq "$file"
          sha256sum "$file"
          base64 -w 1024 "$file" | sed 's/^/UNWIND_CAPTURE /'
