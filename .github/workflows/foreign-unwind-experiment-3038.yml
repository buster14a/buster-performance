name: Foreign unwind hosted experiment 3038
on:
  push:
    branches: [codex/3038-unwind-hosted]
permissions:
  contents: read
jobs:
  unwind:
    runs-on: ubuntu-26.04
    timeout-minutes: 55
    env:
      BUSTER_HOST_ARCH: vector
      BUSTER_DEBUG_INFO: '0'
      BUSTER_SANITIZER: none
      BUSTER_LINKER: auto
      BUSTER_ORACLE_CACHE: 'off'
    steps:
      - name: Check out the compiler at the experiment base
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: buster14a/buster
          ref: 6427879e1143026a12fb0388a20bdea1fe4b2bc5
          persist-credentials: false
      - name: Probe this GitHub-hosted runner
        run: |
          lscpu | grep 'Model name'
          cc -std=c17 -O2 -march=x86-64-v4 -maes -mgfni -mvaes -mavx512vbmi -mavx512vbmi2 -mavx512vpopcntdq -mavx512bitalg -mavx512vnni tools/ci/vector-probe.c -o "$RUNNER_TEMP/probe"
          "$RUNNER_TEMP/probe"
      - name: Check out the experiment scripts
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          path: .experiment
          sparse-checkout: |
            docs/measurements/foreign-unwind-order-3038
          persist-credentials: false
      - name: Set up the pinned compiler and system oracles
        run: |
          set -eu
          sudo apt-get -q update
          sudo apt-get -qy install g++ binutils gdb zstd libzstd-dev libxml2-dev zlib1g-dev
          dirs=$(bash tools/ci/session-toolchain.sh stage)
          tr ':' '\n' <<< "$dirs" >> "$GITHUB_PATH"
      - name: Run the hosted vector qualification
        run: |
          set -euo pipefail
          clang --version | head -1
          gcc --version | head -1
          ld.bfd --version | head -1
          ld.lld --version
          if [ -f .experiment/docs/measurements/foreign-unwind-order-3038/run.sh ]; then
            bash .experiment/docs/measurements/foreign-unwind-order-3038/run.sh
          else
            ./build.sh --config Release --jobs "$(nproc)" > "$RUNNER_TEMP/build.log" 2>&1 || { tail -100 "$RUNNER_TEMP/build.log"; exit 1; }
            mkdir -p "$RUNNER_TEMP/foreign3038"
            ./build/compiler test-foreign --cross-check --directory "$RUNNER_TEMP/foreign3038" --keep
          fi
      - name: Retain paired counts, plans and decoded output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unwind-comparison
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/unwind3038/*.counts
            ${{ runner.temp }}/unwind3038/*.plan
            ${{ runner.temp }}/unwind3038/*.frames
            ${{ runner.temp }}/unwind3038/*.eh
            ${{ runner.temp }}/unwind3038/*.hdr
            ${{ runner.temp }}/unwind3038/*.relocs
            ${{ runner.temp }}/unwind3038/*.foreign
            ${{ runner.temp }}/unwind3038/*.outputs
            ${{ runner.temp }}/unwind3038/flags
            ${{ runner.temp }}/unwind3038/inputs/*.frames
            ${{ runner.temp }}/unwind3038/inputs/*.relocations
