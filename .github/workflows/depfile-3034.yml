# Single issue #3034 measurement submission on this isolated ref.
name: Dependency formatter verification 3034
on:
  push:
    branches: ['hosted/depfile-3034-6aff4f23']
    paths: ['.github/workflows/depfile-3034.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: buster14a/buster
          ref: 4b0d802d613c3d404dfc338c03957ebd4abdfab9
          fetch-depth: 2
          persist-credentials: false
      - name: Probe AVX-512, compare both revisions and run the dependency driver partitions
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c17 -O2 -march=x86-64-v4 -maes -mgfni -mvaes -mavx512vbmi -mavx512vbmi2 -mavx512vpopcntdq -mavx512bitalg -mavx512vnni tools/ci/vector-probe.c -o "$RUNNER_TEMP/probe"
          "$RUNNER_TEMP/probe"
          lscpu | awk '/Model name:|Hypervisor vendor:/ {print}'
          mkdir -p "$RUNNER_TEMP/3034-harness"
          cat > "$RUNNER_TEMP/3034-harness/count.patch" <<'BUSTER_3034_DATA_0'
          diff --git a/src/buster/compiler/c_dependency.c b/src/buster/compiler/c_dependency.c
          --- a/src/buster/compiler/c_dependency.c
          +++ b/src/buster/compiler/c_dependency.c
          @@ -14,6 +14,8 @@
           // hidden here. Filename classification has bounded AVX-512BW and scalar twins.
           
           #include <stdbool.h>
          +#include <stdio.h>
          +#include <stdlib.h>
           #include <stddef.h>
           #include <stdint.h>
           #include <string.h>
          @@ -69,6 +71,8 @@
               char* pointer;
               uint64_t count;
               DependencyStatus status;
          +    uint64_t visited;
          +    uint64_t quoted;
           };
           
           // Classification alone reads the source; count is in [0, 64]. Bits beyond it are zero.
          @@ -167,6 +171,8 @@
               {
                   const uint64_t remaining = length - offset;
                   const uint32_t count = remaining < 64 ? (uint32_t)remaining : 64;
          +        sink->visited += count;
          +        sink->quoted += quote ? count : 0;
                   uint64_t mask = dependency_special(bytes + offset, count, scalar);
                   uint32_t first = 0;
                   while (mask != 0 && sink->status == DEPENDENCY_OK)
          @@ -280,6 +286,12 @@
                       }
                   }
               }
          +    if (getenv("BUSTER_DEPENDENCY_TRACE") != NULL && sink->status == DEPENDENCY_OK)
          +    {
          +        fprintf(stderr, "DEP_PASS %s visited=%llu quoted=%llu output=%llu\n",
          +                sink->pointer == NULL ? "size" : "write", (unsigned long long)sink->visited,
          +                (unsigned long long)sink->quoted, (unsigned long long)sink->count);
          +    }
           }
           
           // With output == NULL, capacity must be zero. `written` receives the required byte
          @@ -288,6 +300,10 @@
           // before touching the destination. The caller can then publish it atomically.
           static DependencyStatus dependency_rule(const DependencyRule* rule, char* output, uint64_t capacity, uint64_t* written)
           {
          +    if (getenv("BUSTER_DEPENDENCY_TRACE") != NULL)
          +    {
          +        fprintf(stderr, "DEP_RULE %s\n", output == NULL ? "query" : "write");
          +    }
               DependencyStatus status = DEPENDENCY_INVALID_INPUT;
               if (written != NULL)
               {
          diff --git a/src/buster/compiler/c_dependency_driver.c b/src/buster/compiler/c_dependency_driver.c
          --- a/src/buster/compiler/c_dependency_driver.c
          +++ b/src/buster/compiler/c_dependency_driver.c
          @@ -75,6 +75,10 @@
               bool result = true;
               if (options->enabled)
               {
          +        if (getenv("BUSTER_DEPENDENCY_TRACE") != NULL)
          +        {
          +            fprintf(stderr, "DEP_PREPARE source=%s files=%u\n", source, (unsigned)file_count);
          +        }
                   const bool input_stdin = strcmp(source, "-") == 0;
                   const char* target = !options->only && primary != NULL ? primary : dependency_filename(arena, source, NULL, 'o');
                   const char* path = dependency_destination(options, source, primary, arena);
          BUSTER_3034_DATA_0
          cat > "$RUNNER_TEMP/3034-harness/sample.sh" <<'BUSTER_3034_DATA_1'
          #!/usr/bin/env bash
          set -euo pipefail
          compiler=$(realpath "$1")
          out=$(realpath -m "$2")
          mkdir -p "$out"
          root=$PWD
          expected_passes=${3:?pass 0 for an uninstrumented build, 2 or 3 for traced builds}
          run()
          {
              local label=$1
              shift
              local status=0
              BUSTER_DEPENDENCY_TRACE=1 "$compiler" "$@" > "$out/$label.out" 2> "$out/$label.err" || status=$?
              printf '%s status=%d\n' "$label" "$status"
              cat "$out/$label.err"
              test "$status" -eq 0
              local dep="$out/$label.out"
              if [[ -f "$label.d" ]]; then dep="$label.d"; cp "$dep" "$out/$label.dep"; fi
              wc -c "$dep"
              sha256sum "$dep"
              awk -v expected="$expected_passes" '/^DEP_PASS / { passes++; split($3,a,"="); visited+=a[2]; split($4,b,"="); quoted+=b[2] } END { printf "TOTAL passes=%d visited=%d quoted=%d\n",passes,visited,quoted; exit (passes != expected) }' "$out/$label.err"
          }
          run real -M -MP tools/performance/main.c
          run example -c -MD -MP -MF example.d examples/assembler/compiler-corpus.c -o example.o
          cp example.o "$out/example.o"
          scratch=$(mktemp -d)
          cd "$scratch"
          mkdir headers
          for ((i=0;i<512;i++)); do
              printf -v h 'h%03d.h' "$i"
              printf '#define VALUE_%d %d\n' "$i" "$i" > "headers/$h"
              printf '#include "headers/%s"\n' "$h" >> all.c
          done
          printf 'int answer(void) { return VALUE_511; }\n' >> all.c
          run stress -M -MP all.c
          run stress_md -c -MMD -MP -MF stress_md.d all.c -o all.o
          cp all.o "$out/stress.o"
          {
              printf 'all.o: all.c'
              for ((i=0;i<512;i++)); do printf ' headers/h%03d.h' "$i"; done
              printf '\n'
              for ((i=0;i<512;i++)); do printf 'headers/h%03d.h:\n' "$i"; done
          } > expected.d
          cmp expected.d "$out/stress.out"
          cmp expected.d "$out/stress_md.dep"
          clang -M -MP all.c > clang.d
          # These generated names contain no escapes. Remove only Clang's physical line continuations.
          sed -z 's/[[:blank:]]*\\\n[[:blank:]]*/ /g' clang.d > clang-unwrapped.d
          cmp expected.d clang-unwrapped.d
          cd "$root"
          BUSTER_3034_DATA_1
          cat > "$RUNNER_TEMP/3034-harness/verify.sh" <<'BUSTER_3034_DATA_2'
          #!/usr/bin/env bash
          set -euo pipefail
          compiler=$(realpath "$1")
          records=$(realpath -m "$2")
          root=$PWD
          mkdir -p "$records"
          sandbox=$(mktemp -d)
          cd "$sandbox"
          mkdir sys
          printf 'int user_header(void);\n' > u.h
          printf 'int system_header(void);\n' > sys/s.h
          cat > a.c <<'C'
          #include "u.h"
          #include <s.h>
          int value(void) { return 42; }
          C
          cp a.c stdin.c
          cat > 'a #$.c' <<'C'
          #include "h\ #$.h"
          int escaped(void) { return 7; }
          C
          : > 'h\ #$.h'
          cat > 'b #$.c' <<'C'
          #include "h #$.h"
          int escaped(void) { return 7; }
          C
          : > 'h #$.h'
          : > empty
          successes=0
          spellings=0
          failures=0
          compare_rule()
          {
              local name=$1 channel=$2 input=$3
              shift 3
              local exe status bin
              for bin in buster clang; do
                  exe=$compiler
                  if [[ $bin == clang ]]; then exe=clang; fi
                  rm -f result.d obj.o a.o
                  status=0
                  "$exe" "$@" < "$input" > "stdout-$bin" 2> "stderr-$bin" || status=$?
                  printf '%d\n' "$status" > "$name-$bin.status"
                  if [[ $status != 0 ]]; then echo "$name: $bin status=$status"; cat "stderr-$bin"; return 1; fi
                  if [[ $channel == file ]]; then
                      test ! -s "stdout-$bin"
                      cp result.d "rule-$bin"
                  else
                      test ! -e result.d
                      cp "stdout-$bin" "rule-$bin"
                  fi
                  test -s "rule-$bin"
                  if [[ $bin == buster && -f obj.o ]]; then cp obj.o "$records/$name.o"; fi
              done
              cmp "$name-buster.status" "$name-clang.status"
              if [[ $name == *-backslash-header ]]; then
                  printf '%s\n' 'o: a\ \#$$.c h\\\ \#$$.h' 'h\\\ \#$$.h:' > want-buster
                  printf '%s\n' 'o: a\ \#$$.c h/\ \#$$.h' 'h/\ \#$$.h:' > want-clang
                  cmp want-buster rule-buster
                  cmp want-clang rule-clang
                  cp rule-clang "$records/$name.clang.make"
                  spellings=$((spellings+1))
              else
                  if ! cmp rule-buster rule-clang; then echo "$name: exact Make output differs"; diff -u rule-clang rule-buster; return 1; fi
                  successes=$((successes+1))
              fi
              cp rule-buster "$records/$name.make"
              cp "$name-buster.status" "$records/$name.status"
          }
          failure()
          {
              local name=$1 input=$2
              shift 2
              printf 'preserve the previous rule\n' > before.d
              cp before.d result.d
              local status=0
              "$compiler" "$@" < "$input" > stdout-error 2> stderr-error || status=$?
              test "$status" -eq 1
              test ! -s stdout-error
              test -s stderr-error
              cmp before.d result.d
              printf '%d\n' "$status" > "$records/$name.status"
              cp result.d "$records/$name.make"
              failures=$((failures+1))
          }
          for mode in M MM MD MMD; do
              action=(-"$mode")
              channel=stdout
              if [[ $mode == MD || $mode == MMD ]]; then action+=(-c -o obj.o -MF result.d); channel=file; fi
              compare_rule "$mode-default" "$channel" empty "${action[@]}" -isystem sys a.c
              compare_rule "$mode-phony" "$channel" empty "${action[@]}" -MP -isystem sys a.c
              compare_rule "$mode-targets" "$channel" empty "${action[@]}" -MP -MT 'r$(X)' -MQ 't\ #$.o' -MT z -isystem sys a.c
              compare_rule "$mode-stdin" "$channel" stdin.c "${action[@]}" -x c -isystem sys -
              compare_rule "$mode-stdin-targets" "$channel" stdin.c "${action[@]}" -MP -MT 'r$(X)' -MQ 't #$.o' -x c -isystem sys -
              compare_rule "$mode-escaped-input" "$channel" empty "${action[@]}" -MP -MT o 'b #$.c'
              compare_rule "$mode-backslash-header" "$channel" empty "${action[@]}" -MP -MT o 'a #$.c'
              stdout_action=(-"$mode")
              if [[ $channel == file ]]; then stdout_action+=(-c -o obj.o); fi
              compare_rule "$mode-mf-stdout" stdout empty "${stdout_action[@]}" -MF - -MP -MT o -isystem sys a.c
          done
          printf '#include "missing.h"\n' > broken.c
          failure missing empty -M -MF result.d broken.c
          failure newline empty -M -MF result.d -MT $'bad\ntarget' -isystem sys a.c
          printf 'int x = ;\n' > broken.c
          failure bad_c empty -c -MD -MF result.d broken.c
          failure bad_stdin broken.c -fsyntax-only -x c -MMD -MF result.d -
          # An ordinary compile should produce identical objects whether a side depfile is requested or omitted.
          "$compiler" -c -isystem sys a.c -o obj.o
          cmp obj.o "$records/MD-default.o"
          cp obj.o "$records/plain.o"
          test "$successes:$spellings:$failures" = "28:4:4"
          echo "Exact short-rule Clang matches=$successes independently pinned backslash-header spellings=$spellings failure/status/preservation cases=$failures" | tee "$records/complete"
          cd "$root"
          BUSTER_3034_DATA_2
          cat > "$RUNNER_TEMP/3034-harness/qualify.sh" <<'BUSTER_3034_DATA_3'
          #!/usr/bin/env bash
          set -euo pipefail
          harness=$1
          output=$2
          base=$3
          head=$4
          mkdir -p "$output"
          out=$(realpath "$output")
          harness=$(realpath "$harness")
          export BUSTER_HOST_ARCH=vector BUSTER_SANITIZER=none BUSTER_SANITIZER_OPTIMIZATION=3 BUSTER_DEBUG_INFO=0 BUSTER_LINKER=auto
          paths=$(bash tools/ci/session-toolchain.sh stage)
          export PATH="$paths:$PATH" BUSTER_TOOLCHAIN=path
          resource=$(clang -print-resource-dir)
          test -f "$resource/include/immintrin.h"
          export BUSTER_CLANG_RESOURCE_DIR="$resource"
          llvm_lib=$(llvm-config --libdir)
          export LD_LIBRARY_PATH="$llvm_lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          echo "Buster and Clang resource directory: $BUSTER_CLANG_RESOURCE_DIR"
          clang --version
          cmake --version
          ninja --version
          status=0
          for revision in base head; do
              target=$base
              if [[ $revision == head ]]; then target=$head; fi
              git checkout --detach "$target"
              test "$(git rev-parse HEAD)" = "$target"
              ./build.sh --config Release --jobs "$(nproc)"
              ./build.sh print-compile-flags --config Release > "$out/$revision.flags"
              sha256sum build/compiler "$out/$revision.flags"
              bash "$harness/verify.sh" build/compiler "$out/$revision-cases" || status=1
              bash "$harness/sample.sh" build/compiler "$out/$revision-samples" 0 || status=1
              clang -std=c17 -O2 -march=native -fwrapv -funsigned-char -fno-strict-aliasing -Wall -Wextra -Werror \
                  tests/driver/dependency_rule.c -o "$out/serializer"
              "$out/serializer" --oracle || status=1
          done
          if test -s "$out/base-cases/complete" && test -s "$out/head-cases/complete" && cmp "$out/base.flags" "$out/head.flags" && diff -qr "$out/base-cases" "$out/head-cases" && diff -qr "$out/base-samples" "$out/head-samples"; then
              echo "Clean base/head: flags, Make bytes, statuses, stdout, and Buster objects are identical."
          else
              status=1
          fi
          # Run the original parts that contain the two dependency sections. The runner tells us how many units
          # it deals, independent of K/N. The counts after each section come from the pinned source's tail.
          bash tools/clang-server/build.sh "$out/clang-server"
          driver=(build/compiler test-checker-driver --executable "$PWD/build/compiler" --in-process --clang-server "$out/clang-server")
          "${driver[@]}" --part 1/64 2>&1 | tee "$out/part-calibration.log" || status=1
          units=$(sed -nE 's/^checker-driver: part 1 of 64: [0-9]+ of the ([0-9]+) units dealt$/\1/p' "$out/part-calibration.log")
          test -n "$units"
          for entry in 'check_test_driver_dependencies(&test,' 'driver_compatibility_tests(executable, clang)'; do
              after=$(awk -v entry="$entry" 'index($0,entry) { active=1; next } /check_test_expect\(&test, check_driver_part.taken != 0/ { active=0 } active && /check_test_driver_takes\(\)/ { n++ } END {print n+0}' src/buster/compiler/c_checker_driver_test.c)
              part=$(((units-after-1)%8+1))
              echo "$entry: $units total, $after groups later, running part $part/8"
              "${driver[@]}" --part "$part/8" 2>&1 | tee "$out/driver-$part.log" || status=1
              if [[ $entry == driver_compatibility* ]]; then grep -E '^CC compatibility: [1-9][0-9]* checks, 0 failures$' "$out/driver-$part.log" || status=1; fi
          done
          for revision in base head; do
              target=$base
              passes=3
              if [[ $revision == head ]]; then target=$head; passes=2; fi
              git checkout --detach "$target"
              git apply "$harness/count.patch"
              ./build.sh --config Release --jobs "$(nproc)"
              ./build.sh print-compile-flags --config Release > "$out/$revision-counted.flags"
              cmp "$out/$revision.flags" "$out/$revision-counted.flags"
              echo "Counted $revision $target"
              sha256sum build/compiler "$harness/count.patch"
              bash "$harness/sample.sh" build/compiler "$out/$revision-counted-samples" "$passes" || status=1
              for file in real.out example.dep example.o stress.out stress_md.dep stress.o; do
                  cmp "$out/$revision-samples/$file" "$out/$revision-counted-samples/$file" || status=1
              done
              git restore -- src/buster/compiler/c_dependency.c src/buster/compiler/c_dependency_driver.c
          done
          echo "Qualification status=$status"
          exit "$status"
          BUSTER_3034_DATA_3
          bash "$RUNNER_TEMP/3034-harness/qualify.sh" "$RUNNER_TEMP/3034-harness" "$RUNNER_TEMP/3034-results" 6427879e1143026a12fb0388a20bdea1fe4b2bc5 4b0d802d613c3d404dfc338c03957ebd4abdfab9
      - name: Save exact outputs and driver reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: depfile-verification-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/3034-results/*-cases/
            ${{ runner.temp }}/3034-results/*-samples/
            ${{ runner.temp }}/3034-results/*.flags
            ${{ runner.temp }}/3034-results/*.log
          if-no-files-found: warn
