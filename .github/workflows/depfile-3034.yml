name: Dependency driver base partitions 3034
on:
  push:
    branches: ['hosted/depfile-3034-6aff4f23']
    paths: ['.github/workflows/depfile-3034.yml']
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: buster14a/buster
          ref: 6427879e1143026a12fb0388a20bdea1fe4b2bc5
          persist-credentials: false
      - name: Run the same two unmodified dependency partitions at the base commit
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c17 -O2 -march=x86-64-v4 -maes -mgfni -mvaes -mavx512vbmi -mavx512vbmi2 -mavx512vpopcntdq -mavx512bitalg -mavx512vnni tools/ci/vector-probe.c -o "$RUNNER_TEMP/probe"
          "$RUNNER_TEMP/probe"
          lscpu | awk '/Model name:|Hypervisor vendor:/ {print}'
          cat > "$RUNNER_TEMP/base-driver.sh" <<'BUSTER_BASE_DRIVER'
          #!/usr/bin/env bash
          set -euo pipefail
          out=$1
          mkdir -p "$out"
          export BUSTER_HOST_ARCH=vector BUSTER_SANITIZER=none BUSTER_SANITIZER_OPTIMIZATION=3 BUSTER_DEBUG_INFO=0 BUSTER_LINKER=auto
          paths=$(bash tools/ci/session-toolchain.sh stage)
          export PATH="$paths:$PATH" BUSTER_TOOLCHAIN=path
          resource=$(clang -print-resource-dir)
          test -f "$resource/include/immintrin.h"
          export BUSTER_CLANG_RESOURCE_DIR="$resource"
          llvm_lib=$(llvm-config --libdir)
          export LD_LIBRARY_PATH="$llvm_lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          git rev-parse HEAD
          clang --version
          printf 'Clang resource directory: %s\n' "$resource"
          ./build.sh --config Release --jobs "$(nproc)"
          ./build.sh print-compile-flags --config Release > "$out/base.flags"
          sha256sum build/compiler "$out/base.flags"
          bash tools/clang-server/build.sh "$out/clang-server"
          status=0
          for part in 7 6; do
              build/compiler test-checker-driver --executable "$PWD/build/compiler" --in-process --clang-server "$out/clang-server" --part "$part/8" 2>&1 | tee "$out/driver-$part.log" || status=1
          done
          grep -E '^CC compatibility: [1-9][0-9]* checks, 0 failures$' "$out/driver-6.log" || status=1
          echo "Baseline dependency partitions status=$status"
          exit "$status"
          BUSTER_BASE_DRIVER
          bash "$RUNNER_TEMP/base-driver.sh" "$RUNNER_TEMP/3034-base-driver"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dependency-base-partitions-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/3034-base-driver/*.log
            ${{ runner.temp }}/3034-base-driver/*.flags
          if-no-files-found: warn
