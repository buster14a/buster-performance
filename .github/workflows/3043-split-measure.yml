name: Split-map allocation experiment
on:
  push:
    branches: [scratch/3043-hosted-vector-split]
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      BUSTER_HOST_ARCH: vector
      BUSTER_SANITIZER: none
      BUSTER_DEBUG_INFO: '0'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: buster14a/buster
          ref: 6427879e1143026a12fb0388a20bdea1fe4b2bc5
          path: buster
          persist-credentials: false
      - name: Check the hosted CPU
        working-directory: buster
        run: |
          lscpu | grep 'Model name'
          cc -std=c17 -O2 -Wall -Wextra -Werror -march=x86-64-v4 -maes -mgfni -mvaes -mavx512vbmi -mavx512vbmi2 -mavx512vpopcntdq -mavx512bitalg -mavx512vnni tools/ci/vector-probe.c -o "$RUNNER_TEMP/probe"
          "$RUNNER_TEMP/probe"
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          path: measures
          sparse-checkout: docs/measurements/tier1-vector-split-3043
          persist-credentials: false
      - name: Run split checks
        working-directory: buster
        run: |
          set -euo pipefail
          harness="$GITHUB_WORKSPACE/measures/docs/measurements/tier1-vector-split-3043"
          if [[ -f "$harness/msan.sh" ]]; then
            bash "$harness/msan.sh"
          elif [[ -f "$harness/run.sh" ]]; then
            bash "$harness/run.sh" "$harness"
          else
            ./build.sh --config Release
            ./build/compiler test-tier1-wide
          fi
