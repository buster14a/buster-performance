name: IR reducer observation counts (3045)
on:
  push:
    branches: [codex/3045-reducer-hosted]
permissions:
  contents: read
jobs:
  reduce:
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: buster14a/buster
          ref: b847801169f2b73aed6496c8fa23e9a5499c94e7
          persist-credentials: false
      - name: Check hosted AVX-512 features
        run: |
          set -eu
          lscpu | grep -E 'Model name|Hypervisor'
          mapfile -d '' flags < <(BUSTER_HOST_ARCH=vector BUSTER_TOOLCHAIN=path ./build.sh print-host-flags)
          cc "${flags[@]}" tools/ci/vector-probe.c -o "$RUNNER_TEMP/probe"
          "$RUNNER_TEMP/probe"
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          path: .measurement
          sparse-checkout: docs/measurements/ir-reducer-cache-3045
          persist-credentials: false
      - name: Measure the normal reducer entry point
        run: bash .measurement/docs/measurements/ir-reducer-cache-3045/run.sh d9eb19fb7c2260c20ed46105f5b7bf578365f07e
