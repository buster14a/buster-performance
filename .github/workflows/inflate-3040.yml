name: Fixed DEFLATE tables 3040
on:
  push:
    branches: ['hosted/3040-inflate-fixed-tables']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      BUSTER_HOST_ARCH: vector
      BUSTER_SANITIZER: none
      BUSTER_SANITIZER_OPTIMIZATION: '3'
      BUSTER_DEBUG_INFO: '0'
      BUSTER_LINKER: auto
      LC_ALL: C
    steps:
      - name: Check out the compiler base
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: buster14a/buster
          ref: 6427879e1143026a12fb0388a20bdea1fe4b2bc5
          persist-credentials: false
      - name: Qualify GitHub-hosted CPU
        run: |
          lscpu | awk '/Model name:|Hypervisor vendor:/ {print}'
          cc -std=c17 -O2 -march=x86-64-v4 -maes -mgfni -mvaes -mavx512vbmi -mavx512vbmi2 -mavx512vpopcntdq -mavx512bitalg -mavx512vnni tools/ci/vector-probe.c -o "$RUNNER_TEMP/probe"
          "$RUNNER_TEMP/probe"
      - name: Check out measurement tools
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          path: .experiment
          sparse-checkout: docs/measurements/inflate-fixed-3040-2026-11-19
          persist-credentials: false
      - name: Check out zlib 1.3.1 for the real ELF input
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: madler/zlib
          ref: 51b7f2abdade71cd9bb0e7a373ef2610ec6f9daf
          path: zlib
          persist-credentials: false
      - name: Stage the compiler's pinned toolchain
        run: |
          set -euo pipefail
          dirs=$(bash tools/ci/session-toolchain.sh stage)
          tr : '\n' <<< "$dirs" >> "$GITHUB_PATH"
      - name: Measure and run test-inflate
        run: |
          set -euo pipefail
          bash .experiment/docs/measurements/inflate-fixed-3040-2026-11-19/run.sh 2>&1 | tee "$RUNNER_TEMP/inflate-3040.log"
      - name: Archive verification output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: inflate-3040-results
          path: ${{ runner.temp }}/inflate-3040.log
          if-no-files-found: ignore
