name: Decode all 1024 CIE identities in the recorded objects
on:
  push:
    branches: [codex/3048-hosted-cie]
    paths: ['.github/workflows/assembler-cie-3048.yml']
permissions:
  contents: read
  actions: read
jobs:
  decode:
    runs-on: ubuntu-26.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: 44605662239
          name: assembler-cie-3048
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/cie-evidence
      - name: Verify raw records and every relocation
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          cc -std=c11 -O2 -Wall -Wextra -Werror docs/measurements/assembler-default-cie-3048/keys.c -o "$RUNNER_TEMP/check-keys"
          cd "$RUNNER_TEMP/cie-evidence"
          for label in base head; do
            prefix="all-keys.$label"
            for section in eh_frame debug_frame; do
              awk -v header="'.rela.$section'" '/^\047/ {take=($0==header); next} take' "$prefix.relocs" > "$prefix.$section.relocations"
              wc -l "$prefix.$section.relocations"
              head -2 "$prefix.$section.relocations"
              "$RUNNER_TEMP/check-keys" "$section" "$prefix.$section" "$prefix.$section.relocations"
              echo "$label .$section: verified 1024 CIEs and 2048 FDEs and relocations."
            done
          done
