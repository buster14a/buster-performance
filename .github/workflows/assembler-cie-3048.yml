name: Inspect hosted assembler CIE records for 3048
on:
  push:
    branches: [codex/3048-hosted-cie]
    paths: ['.github/workflows/assembler-cie-3048.yml']
permissions:
  actions: read
  contents: read
jobs:
  frames:
    runs-on: ubuntu-26.04
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: 44602398738
          name: assembler-cie-3048
          github-token: ${{ github.token }}
      - name: Inspect the independently decoded mixed frames
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          for producer in base gas; do
              echo "BEGIN-$producer"
              cat "mixed.$producer.frames" "mixed.$producer.relocs"
              readelf --debug-dump=frames-interp "mixed.$producer.o"
              echo "END-$producer"
          done
