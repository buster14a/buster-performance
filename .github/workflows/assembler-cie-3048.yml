name: Verify assembler CIE objects and the clean cross-check
on:
  push:
    branches: [codex/3048-hosted-cie]
    paths: ['.github/workflows/assembler-cie-3048.yml']
permissions:
  actions: read
  contents: read
jobs:
  objects:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: buster14a/buster
          ref: 72c0872fa40d398c573b6419546531d226fb8697
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: 44605662239
          name: assembler-cie-3048
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/cie-evidence
      - name: Verify source and object identities
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          cc -O2 -o "$RUNNER_TEMP/dco" tools/dco/dco.c
          "$RUNNER_TEMP/dco" audit --base 6427879e1143026a12fb0388a20bdea1fe4b2bc5 --head 72c0872fa40d398c573b6419546531d226fb8697
          cd "$RUNNER_TEMP/cie-evidence"
          test "$(cat base.commit)" = 6427879e1143026a12fb0388a20bdea1fe4b2bc5
          test "$(cat head.commit)" = 72c0872fa40d398c573b6419546531d226fb8697
          for f in settings.txt counts.tsv objects.sha256 mixed.head.rows; do
              echo "BEGIN $f"
              cat "$f"
              echo "END $f"
          done
          sha256sum -c objects.sha256
          echo 'BEGIN inputs.sha256'
          sha256sum short-{1,100,1000}.s gcc-rerun.s clang-rerun.s mixed.s all-keys.s
          echo 'END inputs.sha256'
          for object in *.base.o; do cmp "$object" "${object/.base.o/.head.o}"; done
      - name: Inspect the full identity domain
        run: |
          cd "$RUNNER_TEMP/cie-evidence"
          awk '
            $1=="Contents" {sec=$4}
            $4=="CIE" {id=sec ":" $1; inside=1; cies[sec]++}
            $1=="Augmentation:" {sig[id]=index($2,"S")!=0}
            $1=="Return" && $2=="address" {col[id]=$NF}
            inside && $1=="DW_CFA_def_cfa:" {ordinary[id]=1}
            $4=="FDE" {
                inside=0; i=fdes[sec]++; key=i<1024 ? i : 2047-i; id=sec ":" substr($5,5);
                mismatch=(!(id in col) || col[id]!=int(key/4) || sig[id]!=int(key/2)%2 || !!ordinary[id]==key%2);
                if (i<1024) first[sec,key]=id; else if (first[sec,key]!=id) mismatch=1;
                if (mismatch && ++bad[sec]<=12) print "mismatch",sec,i,key,id,col[id],sig[id],!!ordinary[id],first[sec,key], $0
            }
            END {for(s in cies) print "summary",s,cies[s],fdes[s],bad[s]+0}
          ' all-keys.head.frames
          for tag in base head; do
              readelf -wf "all-keys.$tag.o" > "$tag.dump"
              cmp "$tag.dump" "all-keys.$tag.frames"
          done
          sed -n '1,38p' all-keys.head.frames
  cross-check:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      LC_ALL: C
      BUSTER_HOST_ARCH: vector
      BUSTER_DEBUG_INFO: '0'
      BUSTER_SANITIZER: none
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: buster14a/buster
          ref: 72c0872fa40d398c573b6419546531d226fb8697
          persist-credentials: false
      - name: Qualify this GitHub-hosted worker
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          lscpu | grep 'Model name'
          cc -march=x86-64-v4 -mavx512vbmi -mavx512vbmi2 -mavx512vpopcntdq -mavx512bitalg -mavx512vnni -mgfni -mvaes -maes tools/ci/vector-probe.c -o "$RUNNER_TEMP/vector-probe"
          "$RUNNER_TEMP/vector-probe"
      - name: Stage the pinned toolchain
        run: |
          paths=$(bash tools/ci/session-toolchain.sh stage)
          tr ':' '\n' <<< "$paths" >> "$GITHUB_PATH"
      - name: Build and run the complete clean assembler cross-check
        run: |
          clang --version
          ./build.sh print-compile-flags --config Release | tr '\0' ' '
          echo
          ./build.sh --config Release > "$RUNNER_TEMP/build.log" 2>&1 || { tail -60 "$RUNNER_TEMP/build.log"; exit 1; }
          sha256sum build/compiler
          ./build/compiler test-assembler --cross-check | tee "$RUNNER_TEMP/cross-check.log"
