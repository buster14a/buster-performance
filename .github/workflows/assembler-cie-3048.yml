name: Hosted assembler CIE comparison for 3048
on:
  push:
    branches: [codex/3048-hosted-cie]
    paths: ['docs/measurements/assembler-default-cie-3048/**']
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    env:
      BUSTER_HOST_ARCH: vector
      BUSTER_DEBUG_INFO: '0'
      LC_ALL: C
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: buster14a/buster
          ref: 6427879e1143026a12fb0388a20bdea1fe4b2bc5
          persist-credentials: false
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          path: receipt
          persist-credentials: false
      - name: Qualify this GitHub-hosted worker
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          lscpu | grep -E 'Model name|^CPU\(s\)'
          cc -march=x86-64-v4 -mavx512vbmi -mavx512vbmi2 -mavx512vpopcntdq -mavx512bitalg -mavx512vnni -mgfni -mvaes -maes tools/ci/vector-probe.c -o "$RUNNER_TEMP/vector-probe"
          "$RUNNER_TEMP/vector-probe"
      - name: Stage the pinned toolchain
        run: |
          paths=$(bash tools/ci/session-toolchain.sh stage)
          tr ':' '\n' <<< "$paths" >> "$GITHUB_PATH"
      - name: Assemble and cross-check
        run: bash receipt/docs/measurements/assembler-default-cie-3048/measure.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: assembler-cie-3048
          path: ${{ runner.temp }}/cie-results
          if-no-files-found: ignore
          retention-days: 14
