<div id="buster-throughput-budgets-9700x">
  <h2>What the throughput target allows</h2>
  <div class="viz-controls" role="group" aria-label="Compilation throughput target">
    <button class="btn" type="button" data-goal="1" aria-pressed="true">1 GB/s across the machine</button>
    <button class="btn" type="button" data-goal="8" aria-pressed="false">1 GB/s per core</button>
  </div>
  <div class="text-small text-muted" data-goal-label>8 physical cores · 1 GB/s aggregate</div>
  <h3>Memory traffic</h3>
  <svg class="budget-chart" data-memory role="img" aria-label="Current DRAM traffic per source byte compared with the traffic budgets for the selected goal"></svg>
  <h3>Instruction work</h3>
  <div class="text-small text-muted">Fixed measured supply of user CPU cycles</div>
  <svg class="budget-chart" data-work role="img" aria-label="Current instructions per source byte compared with instruction budgets at current IPC and recovered single-core IPC"></svg>
  <div class="text-small tabular-nums" data-reduction aria-live="polite"></div>
</div>
<style>
  #buster-throughput-budgets-9700x .budget-chart { display:block; width:100%; overflow:visible; }
  #buster-throughput-budgets-9700x .budget-chart text { fill:var(--foreground); font-size:12px; font-weight:400; }
  #buster-throughput-budgets-9700x .budget-chart .axis-label { fill:var(--muted-foreground); }
  #buster-throughput-budgets-9700x h3 { margin-bottom:0.4em; }
  #buster-throughput-budgets-9700x [data-reduction] { margin-top:0.5em; }
</style>
<script>
(() => {
  const root = document.getElementById('buster-throughput-budgets-9700x');
  const ns = 'http://www.w3.org/2000/svg';
  const charts = [root.querySelector('[data-memory]'), root.querySelector('[data-work]')];
  const measured = { traffic:268.7347, bandwidth:51.6215, theoreticalBandwidth:83.2, instructions:165.3406, instructionRate:31.0057, userCycleRate:31.3920, oneCoreIPC:2.24349 };
  const saved = window.openai?.widgetState;
  let goal = saved?.privateContent?.goal === 8 ? 8 : 1;
  let initialized = false;
  const fmt = value => value < 10 ? value.toFixed(2) : value.toFixed(1);
  function element(name, attrs, text) {
    const el = document.createElementNS(ns, name);
    Object.entries(attrs).forEach(([key,value]) => el.setAttribute(key,String(value)));
    if (text !== undefined) el.textContent = text;
    return el;
  }
  function draw(svg, rows, unit, animate) {
    const width = Math.max(280, Math.floor(root.getBoundingClientRect().width));
    const left = 12, right = 16, plotWidth = width-left-right, height = 208;
    const maximum = Math.max(...rows.map(row => row.value)) * 1.1;
    const prior = [...svg.querySelectorAll('[data-bar]')].map(bar => +bar.getAttribute('width'));
    svg.replaceChildren();
    svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
    svg.setAttribute('height', height);
    rows.forEach((row,index) => {
      const y = index*53+15;
      svg.append(element('text',{x:left,y},row.label));
      svg.append(element('text',{x:width-right,y,'text-anchor':'end'},fmt(row.value)));
      svg.append(element('rect',{x:left,y:y+9,width:plotWidth,height:16,fill:'var(--muted)',opacity:0.45}));
      const targetWidth = plotWidth*row.value/maximum;
      const bar = element('rect',{x:left,y:y+9,width:targetWidth,height:16,fill:`var(--viz-series-${index+1})`,'data-bar':index,'data-tooltip':`${row.label}: ${fmt(row.value)} ${unit}`});
      svg.append(bar);
      if (animate && !window.matchMedia('(prefers-reduced-motion: reduce)').matches && prior[index] !== undefined) {
        bar.animate([{width:`${prior[index]}px`},{width:`${targetWidth}px`}],{duration:220,easing:'ease-out'});
      }
    });
    const axisY = 178;
    svg.append(element('line',{x1:left,x2:width-right,y1:axisY,y2:axisY,stroke:'var(--border)','stroke-width':1}));
    const ticks = width < 400 ? 3 : 5;
    for (let tick=0;tick<ticks;++tick) {
      const value = maximum*tick/(ticks-1), x = left+plotWidth*tick/(ticks-1);
      svg.append(element('text',{x,y:axisY+15,'text-anchor':tick===0?'start':tick===ticks-1?'end':'middle',class:'axis-label'},Math.round(value)));
    }
    svg.append(element('text',{x:width/2,y:height-1,'text-anchor':'middle',class:'axis-label'},unit));
  }
  function render(animate=false) {
    root.querySelectorAll('[data-goal]').forEach(button => button.setAttribute('aria-pressed',String(+button.dataset.goal === goal)));
    root.querySelector('[data-goal-label]').textContent = `8 physical cores · ${goal} GB/s aggregate`;
    draw(charts[0],[
      {label:'Current traffic',value:measured.traffic},
      {label:'Budget at observed bandwidth',value:measured.bandwidth/goal},
      {label:'Budget at hardware ceiling',value:measured.theoreticalBandwidth/goal}
    ],'DRAM bytes / source byte',animate);
    draw(charts[1],[
      {label:'Current work',value:measured.instructions},
      {label:'Budget at current IPC',value:measured.instructionRate/goal},
      {label:'Budget at one-core IPC',value:measured.userCycleRate*measured.oneCoreIPC/goal}
    ],'User instructions / source byte',animate);
    root.querySelector('[data-reduction]').textContent = `At observed bandwidth: ${(measured.traffic/(measured.bandwidth/goal)).toFixed(1)}× less traffic required`;
    initialized = true;
  }
  root.querySelectorAll('[data-goal]').forEach(button => button.addEventListener('click',() => {
    goal = +button.dataset.goal;
    render(true);
    window.openai?.setWidgetState?.({modelContent:{throughputGoalGBs:goal,cores:8},privateContent:{goal}})?.catch(() => {});
  }));
  window.addEventListener('openai:set_globals',event => {
    const state = event.detail?.globals?.widgetState;
    if (state?.privateContent?.goal === 1 || state?.privateContent?.goal === 8) {
      goal = state.privateContent.goal;
      render(false);
    }
  });
  new ResizeObserver(() => render(false)).observe(root);
  render(initialized);
})();
</script>
