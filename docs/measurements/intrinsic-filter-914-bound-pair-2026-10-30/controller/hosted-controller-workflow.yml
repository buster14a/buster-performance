name: Build the reviewed 914 controller only

# A reviewed branch push is the bounded build route. There is no native runner,
# PR trigger, schedule, workflow_dispatch, Buster build or controller execution.
on:
  push:
    branches: [codex/prepare-914-controller-build]

permissions:
  contents: read

concurrency:
  group: controller914-hosted-${{ github.ref }}
  cancel-in-progress: false

jobs:
  controller:
    if: github.repository == 'buster14a/buster-performance'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Require the disposable GitHub-hosted Linux runner
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          . /etc/os-release
          test "$VERSION_ID" = 26.04

      - name: Check out only the triggering controller and receipt recipe
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3, same pin as Buster's approved workflow
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            docs/measurements/intrinsic-filter-914-input-binding-2026-10-30

      - name: Compile only the frozen controller and retain inert build receipts
        shell: bash
        run: bash docs/measurements/intrinsic-filter-914-input-binding-2026-10-30/build-controller-hosted.sh

      - name: Preserve the inert ELF and genuine success or failure receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2, same pin as Buster's approved workflow
        with:
          name: controller914-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/914-controller-receipt
          if-no-files-found: error
          retention-days: 7
